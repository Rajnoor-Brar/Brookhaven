# sherpa.toml — EIC photoproduction with Sherpa 3 (photo_ep.sherpa.yaml), through the same Rivet
# analysis as eic.toml (rework v2 schema, docs/04_Config_Reference.md).
#
#   hep run PhotoProduction/sherpa            18x275, LO, MPI off: v1 measured 9,636 ± 782 pb (L24)
#   hep run PhotoProduction/sherpa pdf        the proton PDF swept (MPI_PDF_SET follows it)
#
# Its own file, because the Pythia-only settings of eic.toml (pT0Ref, MPI, ProcessType) have no
# Sherpa key and would be refused as unconsumed (C7). The card's DIFFERS notes say where the two
# generators' setups cannot be matched.

[run]
serial        = 4
name          = "sherpa"
project       = "PhotoProduction"
run           = "single"
events        = 5_000
threads       = 1                   # Sherpa runs one process per point
chain         = [["sherpa", "rivet"], "yd2rt"]   # every configuration's, unless it says its own

[cfgs.single]
description = "One point at 18x275 e+p, LO, no MPI (the card's Amisic note)"

[cfgs.pdf]
serial      = 1
description = "Proton-PDF comparison at 18x275"
vary        = ["pdf"]

[tools.sherpa]
card        = "photo_ep.sherpa.yaml"
output      = "events.hepmc"

[tools.rivet]
input       = "sherpa"
analyses    = ["photo_eic"]
output      = "photo.yoda"

[tools.yd2rt]
input       = "rivet"
output      = "photo.root"

[quantities.energies]
fixed  = "18x275"
points = [
  { tag = "18x275", value = [275, 18], label = "18x275 GeV" },
  { tag = "27x920", value = [920, 27.5], label = "27x920 GeV" },
]

[quantities.beams]
fixed  = "ep"
points = [
  { tag = "ep", value = [2212, -11], label = "$e^{+}$p" },
  { tag = "em", value = [2212, 11], label = "$e^{-}$p" },
]

[quantities.pdf]
fixed  = "NNPDF23lo"
points = [
  { tag = "NNPDF23lo", value = "NNPDF23_lo_as_0130_qed", label = "NNPDF 2.3 QCD+QED LO" },
  { tag = "MSTW08lo", value = "MSTW2008lo68cl", label = "MSTW 2008 LO" },
]

[plot]
formats = ["png"]
ratio   = true

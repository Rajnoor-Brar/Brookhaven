# vary        = ["pthatmin"]

# [cfgs.process]
# serial      = 8
# description = "Photon:ProcessType 0 vs 1 at 18x275: a null comparison with this card (00/B13)"
# vary        = ["process"]
# fixed       = { energies = "18x275" }

# [cfgs.radius]
# serial      = 9
# description = "Jet radius R at 18x275 (three points, three generations: V9)"
# vary        = ["radius"]
# fixed       = { energies = "18x275" }

# [cfgs.inproc]
# serial      = 11
# description = "Pythia and Rivet in one process (InprocJets): the card and seeds of `single`, no FIFO"
# vary        = []
# chain       = ["jets", "yd2rt"]
# prelim      = {}              # no FIFO: the events never leave the process

# [cfgs.delphes]
# serial      = 12
# description = "Detector level: the events to a file, Delphes (ATLAS card), then a jet count (02 §5.1)"
# vary        = []
# chain       = ["pythia_file", "delphes", "jets_reco"]
# prelim      = { files = ["showered.hepmc"] }       # a file: Delphes cannot read a FIFO (L11)

# [cfgs.replicas]
# serial      = 10
# description = "Three seed replicas at the static point, merged after them by rivet-merge (post)"
# vary        = ["replica"]
# chain       = [["pythia", "rivet"]]
# post        = ["merge"]

[tools.jets]                  # Pythia and Rivet in one process (InprocJets); InProcEIC.toml runs it
uses           = "module"
executable     = "InprocJets.exe"
output         = "photo.yoda"

[tools.pythia_file]           # the same generator, writing a file for a tool that cannot stream
uses        = "pythia"
card        = "{var:card}"
output      = "showered.hepmc"

[tools.delphes]
card        = "delphes_card_ATLAS.tcl"
input       = "showered.hepmc"
output      = "delphes.root"

[tools.jets_reco]             # a custom analysis at detector level
uses        = "exec"
executable  = "path:python3"
arguments   = ["{work}/modules/PhotoProduction/delphes_jets.py", "{input}", "{partial:output}"]
input       = "delphes.root"
output      = "jets_reco.json"

[tools.merge]                 # post: photo.yoda of every point → one YODA with their statistics
input       = "photo.yoda"
output      = "merged.yoda"

# ── its own quantities (lepton, pdf, pt0ref and mpi are common.toml's; pthatmin, process,
# radius and replica, which only InProcEIC varies, are InProcEIC.toml's) ──────────────────────────────

[quantities.energies]         # common.toml's beams, in this study's order and labels, 27x920 left out
exclude = [4]

# ETMIN, which no configuration varies (kept to uncomment):
# [quantities.etmin]
# target = "rivet/photo_eic"
# key    = "ETMIN"
# values = [4.0, 5.0, 6.0]
# tags   = ["et4", "et5", "et6"]
# labels = ["$E_{T}$ > 4 GeV", "$E_{T}$ > 5 GeV", "$E_{T}$ > 6 GeV"]

# ── plot: common.toml's, with these over it ───────────────────────────────────────────────────────
fixed  = "18x275"
points = [
  { tag = "18x275", value = [275, 18], label = '$\sqrt{s}$ = 140.7 GeV' },
  { tag = "10x100", value = [100, 10], label = '$\sqrt{s}$ = 63.2 GeV' },
  { tag = "5x41", value = [41, 5], label = '$\sqrt{s}$ = 28.6 GeV' },
  { tag = "27x920", value = [920, 27.5], label = '$\sqrt{s}$ = 318.1 GeV' },
]

[plot]
backend = ["root", "yoda", "mpl"]
formats = ["pdf", "png"]

[plot.style]
legend.position = "best"
ratio.range     = [0, 2.5]
ratio.limits    = [0, 2.5]
text.legend     = 9
text.header     = 8

[plot.figures.eta_algorithms]
class   = "overlay"
objects = ["d02-x01-y01", "d11-x01-y01", "d12-x01-y01"]
labels  = ["$k_{T}$", "anti-$k_{T}$", "SISCone"]
ratio   = true
style.ratio.range  = [0.8, 1.1]
style.ratio.limits = [0.8, 1.1]

[quantities.pdf]                # the imported quantity, fixed here
fixed = "NNPDF23lo"

[quantities.pt0ref]                # the imported quantity, fixed here
fixed = "pt34"

[quantities.mpi]                # the imported quantity, fixed here
fixed = "mpi"

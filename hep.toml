# hep.toml — this folder is a Heimdall work dir (made by `hep setup`, 2026-10-14).
# [work] marks it; [framework] expects is the Heimdall it was made by: a Heimdall without that
# revision warns (docs/framework/01_Target.md §4.2). [cluster] is optional; any other table is refused.
[work]
name = "Brookhaven"

[framework]
expects = "864c0f498dee4f5cbcd3b0c1f9f44f15fc1f3cc1"

# On a Slurm cluster, this work dir's defaults for `hep cluster` (docs/04_Config_Reference.md §16), over
# the machine root's machine.toml [cluster]; a run TOML's [cluster] is over them. Uncomment what the
# site needs:
# [cluster]
# account   = "my-group"
# partition = "standard"
# setup     = ["module load gcc/13"]
